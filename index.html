<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東京路線図ゲーム</title>
<style>
  :root {
    --bg: #f6f3ec; --panel: #ffffff; --ink: #222; --sub: #6b6b6b; --line: #ddd7c8;
    --accent: #2f7d32; --ok: #2f7d32; --ng: #c0392b; --warn: #b9770e;
    --map-bg: #fbf9f3; --grid: #eee9dc; --halo: #fbf9f3;
    --water: #cfe6f3; --river: #b9d9ec; --park: #dcebd0; --bgtext: #9bb7c8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #222427; --ink: #eee; --sub: #9a9a9a; --line: #3a3d41;
      --accent: #7fd37f; --ok: #7fd37f; --ng: #ff8a7a; --warn: #f0b860;
      --map-bg: #1d1f22; --grid: #26292d; --halo: #1d1f22;
      --water: #1d3345; --river: #25465d; --park: #26382a; --bgtext: #4d6c82;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; }
  header { padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 18px; margin: 0; }
  header h1 small { font-size: 12px; color: var(--sub); font-weight: 400; margin-left: 6px; }
  form { display: flex; gap: 8px; flex: 1; min-width: 240px; max-width: 420px; }
  input[type=text] { flex: 1; font-size: 18px; padding: 8px 12px; border-radius: 8px; min-width: 0;
    border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  button, select { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  button:hover { filter: brightness(0.96); }
  #message { min-height: 22px; font-size: 14px; flex-basis: 100%; }
  #message.ok { color: var(--ok); } #message.ng { color: var(--ng); } #message.warn { color: var(--warn); }

  main { flex: 1; min-height: 0; display: flex; }
  #mapWrap { flex: 1; min-width: 0; position: relative; background: var(--map-bg); overflow: hidden; }
  svg#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  svg#map.dragging { cursor: grabbing; }
  #mapTools { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
  #mapTools button { padding: 6px 10px; }

  #legend { position: absolute; left: 10px; top: 10px; background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 12.5px; max-width: 200px; }
  #legend .lh { font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; user-select: none; }
  #legend { max-height: calc(100% - 70px); overflow-y: auto; }
  #legend.collapsed .items, #legend.collapsed .lt { display: none; }
  #legend .lt { display: flex; gap: 14px; padding-top: 4px; margin-top: 4px; border-top: 1px solid var(--line); }
  #legend .lt a { color: var(--accent); cursor: pointer; font-weight: 600; user-select: none; }
  .lineTools { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub); font-weight: 600; margin-bottom: -6px; }
  .lineTools span { margin-right: auto; }
  .lineTools button { padding: 3px 9px; font-size: 12.5px; }
  /* 路線図ビューア（全部入り）：ゲームの操作はすべて隠す */
  body.viewonly .inputRow, body.viewonly #scoreBox, body.viewonly #historyWrap { display: none; }
  #legend .item { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; user-select: none; }
  #legend .item.off { opacity: .35; text-decoration: line-through; }
  #legend .item.empty .nm { color: var(--sub); }
  #legend .sw { width: 22px; height: 6px; border-radius: 3px; flex: none; }

  aside { width: 310px; background: var(--panel); border-left: 1px solid var(--line);
    padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  #total { font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; }
  #total span:last-child { font-variant-numeric: tabular-nums; }
  #cards { display: flex; flex-direction: column; gap: 6px; }
  .lineCard { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .lineCard label { display: flex; align-items: center; gap: 7px; font-size: 13.5px; cursor: pointer; }
  .lineCard .badge { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .lineCard .cnt { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--sub); }
  .lineCard.done .cnt { color: var(--ok); font-weight: 700; }
  .bar { height: 5px; background: var(--line); border-radius: 3px; margin-top: 5px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; transition: width .4s; }
  aside h2 { font-size: 13px; color: var(--sub); margin: 0 0 6px; font-weight: 600; }
  #history { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 13px; padding: 2px 8px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
  .inputRow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; flex: 1 1 100%; min-width: 0; }
  .gameBtns { display: flex; gap: 6px; flex-wrap: wrap; }
  .gameBtns button:disabled { opacity: .5; cursor: default; }
  .gameBtns button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #scoreBox { margin-left: auto; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #scoreBox .lbl { font-size: 12px; color: var(--sub); }
  #scoreBox b { font-size: 24px; }
  #scoreBox .max { font-size: 13px; color: var(--sub); }
  #scoreNote { font-size: 11.5px; color: var(--warn); min-height: 14px; }
  .stg.hint .stDot { fill: var(--halo); stroke: #999; stroke-dasharray: 3 3; }
  .stg.hint .stLabel { fill: var(--sub); font-weight: 700; }

  #toast { white-space: pre-line; position: absolute; left: 50%; top: 16px; transform: translateX(-50%) scale(.9);
    background: var(--accent); color: #fff; padding: 12px 22px; border-radius: 12px; font-size: 18px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: all .35s; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

  .seg { stroke-linecap: round; fill: none; }
  .seg.new { animation: fadein .6s ease-out; }
  .stg.new { animation: pop .45s cubic-bezier(.2,1.6,.4,1); transform-box: fill-box; transform-origin: center; }
  .stLabel { font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-linejoin: round; }
  .stg.missed .stDot { fill: var(--halo); stroke: #999; stroke-dasharray: 3 3; }
  .stg.missed .stLabel { fill: var(--sub); font-weight: 400; }
  .bgLabel { fill: var(--bgtext); font-size: 26px; letter-spacing: 4px; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  /* --- メインメニュー --- */
  #menu { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; padding: 40px 16px; gap: 28px; }
  #menu h1 { font-size: 30px; margin: 0; text-align: center; }
  #menu .lead { color: var(--sub); margin: 8px 0 0; text-align: center; }
  #menu .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; width: 100%; max-width: 940px; }
  .modeCard { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 20px;
    text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 10px; color: var(--ink); font-size: 15px; }
  .modeCard:hover { border-color: var(--accent); filter: none; transform: translateY(-2px); }
  .modeCard h2 { margin: 0; font-size: 21px; }
  .modeCard p { margin: 0; color: var(--sub); font-size: 13.5px; line-height: 1.6; }
  .modeCard .stripes { display: flex; gap: 4px; flex-wrap: wrap; }
  .modeCard .stripes i { display: block; width: 28px; height: 7px; border-radius: 4px; }
  .modeCard .prog { font-variant-numeric: tabular-nums; font-size: 13.5px; display: flex; justify-content: space-between; }
  .modeCard .bar { margin-top: 0; }
  .modeCard .sc { font-size: 13px; color: var(--sub); display: flex; gap: 14px; flex-wrap: wrap; }
  .modeCard .sc b { color: var(--ink); }
  .modeCard .tag { font-size: 12px; color: var(--accent); font-weight: 700; }
  .modeCard.complete { border-color: var(--ok); }
  #backBtn { padding: 6px 10px; }

  @media (max-width: 760px) {
    main { flex-direction: column; }
    aside { width: 100%; border-left: none; border-top: 1px solid var(--line); max-height: 42%; }
    #legend { display: none; }
  }
</style>
</head>
<body>
<div id="menu">
  <div><h1>🚃 東京路線図ゲーム</h1><p class="lead" id="menuLead"></p></div>
  <div class="modes" id="modeList"></div>
  <button id="menuBackBtn" hidden>← 路線の選択に戻る</button>
</div>
<header>
  <button id="backBtn" title="メインメニューに戻る">☰ メニュー</button>
  <h1>🚃 東京路線図ゲーム<small id="modeName"></small></h1>
  <div id="scoreBox" title="ヒントを使うと、その後に入力した駅の得点が下がります"><span class="lbl">スコア</span> <b id="scoreVal">0</b><span class="max"> / 100</span><div id="scoreNote"></div></div>
  <div class="inputRow">
    <form id="form" autocomplete="off">
      <input type="text" id="input" placeholder="駅名を入力（例：しんじゅく / 新宿）" autofocus>
      <button class="primary" type="submit">追加</button>
    </form>
    <div class="gameBtns">
      <button id="hintBtn">💡 ヒント</button>
      <button id="giveUpBtn">🏳 ギブアップ</button>
      <button id="resetBtn">↺ リセット</button>
    </div>
  </div>
  <div id="message"></div>
</header>
<main>
  <div id="mapWrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="legend"><div class="lh"><span>凡例（クリックで表示切替）</span><span class="arrow">▾</span></div><div class="items"></div><div class="lt"><a id="lgAll">全選択</a><a id="lgNone">全解除</a></div></div>
    <div id="mapTools"><button id="zoomIn">＋</button><button id="zoomOut">－</button><button id="fitFound">駅に合わせる</button><button id="fitAll">全域</button></div>
    <div id="toast"></div>
  </div>
  <aside>
    <div id="total"><span>入力した駅</span><span></span></div>
    <div class="lineTools"><span>路線の表示</span><button id="selAll">すべて選択</button><button id="selNone">すべて解除</button></div>
    <div id="cards"></div>
    <div id="historyWrap">
      <h2>入力した駅（新しい順）</h2>
      <div id="history"></div>
    </div>
  </aside>
</main>

// 新しい10駅チャレンジ：ランダムに10駅を欠けさせ、残りは最初から入力済みにする
function freshChallenge(m) {
  const ids = m.stationObjs.map(s => s.id), pick = new Set();
  while (pick.size < Math.min(CHALLENGE_N, ids.length)) pick.add(ids[Math.floor(Math.random() * ids.length)]);
  return { found: ids.filter(id => !pick.has(id)), hint: 0, gaveUp: false, score: 0, missing: [...pick] };
}
// 保存データを読む。type="challenge" で保存がなければ新しい10駅チャレンジを作る（create=false なら null）
function loadState(m, type, create = true) {
  const ch = type === "challenge", stIds = new Set(m.stationObjs.map(s => s.id)), st = { found: [], hint: 0, gaveUp: false, score: 0, missing: [] };
  try {
    const v = JSON.parse(localStorage.getItem(stateKey(m, type)));
    if (v && Array.isArray(v.found)) {
      st.found = v.found.filter(id => stIds.has(id));
      st.hint = Math.min(3, Math.max(0, v.hint | 0)); st.gaveUp = !!v.gaveUp; st.score = +v.score || 0;
      if (!ch) return st;
      st.missing = (v.missing || []).filter(id => stIds.has(id));
      if (st.missing.length === Math.min(CHALLENGE_N, stIds.size)) return st;
    } else if (type === "normal") {
      // 旧版の記録（駅idの配列だけ）を引き継ぐ。ヒント機能がなかったので満点計算にする
      for (const k of [m.saveKey, m.legacyKey]) {
        const old = k && JSON.parse(localStorage.getItem(k));
        if (Array.isArray(old)) { st.found = old.filter(id => stIds.has(id)); st.score = st.found.length * 100 / stIds.size; break; }
      }
    }
  } catch (e) {}
  return ch ? (create ? freshChallenge(m) : null) : st;
}

function adjOf(lines) {

    for (const seq of l.seqs) for (let i = 0; i + 1 < seq.length; i++) adj.push([pos(seq[i]), pos(seq[i + 1])]);

}
function buildAdj() { ADJ = adjOf(LINES); }
const hit = (a, b) => a.x0 < b.x1 && b.x0 < a.x1 && a.y0 < b.y1 && b.y0 < a.y1;

      case "l": x0 = px - d - w; y0 = py - h / 2; anchor = "end"; tx = x0 + w; break;
      case "t": x0 = px - w / 2; y0 = py - d * 0.8 - h; anchor = "middle"; tx = px; break;
      case "b": x0 = px - w / 2; y0 = py + d * 0.8; anchor = "middle"; tx = px; break;
      case "tr": x0 = px + d * 0.6; y0 = py - d * 0.5 - h; anchor = "start"; tx = x0; break;
      case "tl": x0 = px - d * 0.6 - w; y0 = py - d * 0.5 - h; anchor = "end"; tx = x0 + w; break;
      case "br": x0 = px + d * 0.6; y0 = py + d * 0.5; anchor = "start"; tx = x0; break;

    giveUpActive = false; render(); say(learn ? "再開しました。" : "再開しました。スコアは増えません。", "warn"); return input.focus();
  }
  if (learn) { // 学習モードはスコアがないので、確認なしで全駅名を見られる
    giveUpActive = true; fitIds(STATIONS.filter(s => onVisibleLine(s.id)).map(s => s.id)); render();
    say("全駅名を表示中です。もう一度押すと再開します。", "warn");
    return input.focus();
  }
  if (!gaveUp && !confirm("ギブアップすると全駅名が地図に表示されます。\nこの先はスコアが増えなくなります（再開しても戻りません）。よろしいですか？")) return;
  gaveUp = true; giveUpActive = true; save();
  fitIds(STATIONS.filter(s => onVisibleLine(s.id)).map(s => s.id)); // 全駅が見える範囲へ
  render();
  say("ギブアップ中：全駅名を表示しています。駅名を入力して路線図を作れます（スコアは増えません）。", "warn");
  input.focus();
});
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm(challenge ? "スコア・ヒント・ギブアップの記録を消して、新しい10駅でやり直しますか？" : learn ? "入力した駅とヒントの記録をすべて消してやり直しますか？" : "入力した駅・スコア・ヒント・ギブアップの記録をすべて消してやり直しますか？")) return;
  const st = challenge ? freshChallenge(MODE) : { found: [], hint: 0, gaveUp: false, score: 0, missing: [] };
  applyState(st);
  save(); seedDrawn(); fitFound(); render();
  say(challenge ? `新しい10駅に挑戦！ 欠けている駅を入力しよう` : "リセットしました"); input.focus();
});

// ============================================================
// プレイの開始とメインメニュー
// ============================================================
const menuEl = document.getElementById("menu");
const applyState = st => { found = st.found; hintLevel = st.hint; gaveUp = st.gaveUp; score = st.score; missing = st.missing || []; giveUpActive = false; };
// すでに描かれている駅・線は、アニメなしで表示する
function seedDrawn() {
  drawn.clear(); K = 0;
  found.forEach(id => drawn.add("st:" + id));
  LINES.forEach(l => segmentsOf(l).forEach(([a, b]) => drawn.add(`${l.id}:${a < b ? a + "|" + b : b + "|" + a}`)));
}
// 路線 m を、type（"normal" / "challenge" / "learn"）で始める
function startPlay(m, type) {
  MODE = m; STATIONS = m.stationObjs; LINES = m.lineObjs;
  playType = type; challenge = type === "challenge"; learn = type === "learn"; viewOnly = false;
  document.body.classList.remove("viewonly");
  LINE_BY_ID = new Map(LINES.map(l => [l.id, l]));
  STATION_BY_ID = new Map(STATIONS.map(s => [s.id, s]));
  LINES_OF = new Map(STATIONS.map(s => [s.id, LINES.filter(l => l.uniq.includes(s.id))]));
  NAME_INDEX = new Map();
  buildAdj(); labelCache = new Map();
  applyState(loadState(m, type)); hidden.clear();
  if (challenge) save(); // 新しく作った10駅を保存して、再読み込みしても同じ問題を続けられるようにする
  document.getElementById("modeName").textContent = m.sub + ({ normal: "", challenge: "　10駅チャレンジ", learn: "　学習モード" })[type];
  document.getElementById("legend").style.display = LINES.length > 1 ? "" : "none";
  seedDrawn();
  menuEl.style.display = "none";
  fitFound(); render();
  const left = missing.filter(id => !found.includes(id)).length;
  say(challenge
    ? (left < missing.length ? `続きから再開（残り${left}駅）` : `欠けている${missing.length}駅を入力しよう！ ヒントなしで全部当てると100点`)
    : learn
    ? (found.length ? `続きから再開（${found.length}駅）` : "地図の読み仮名を手がかりに、駅名を入力しよう！ ヒントは何度使っても減点なし")
    : (found.length ? `続きから再開（${found.length}駅）` : `${m.sub}の駅名を入力してみよう！ ヒントなしで全駅クリアすると100点`));
  input.focus();
}

// 全部入り：全駅を入力済みにした状態で、路線図を表示するだけ（入力・ヒント・スコアなし）
function startView(m) {
  MODE = m; STATIONS = m.stationObjs; LINES = m.lineObjs;
  playType = "view"; challenge = false; learn = false; viewOnly = true;
  document.body.classList.add("viewonly");
  LINE_BY_ID = new Map(LINES.map(l => [l.id, l]));
  STATION_BY_ID = new Map(STATIONS.map(s => [s.id, s]));
  LINES_OF = new Map(STATIONS.map(s => [s.id, LINES.filter(l => l.uniq.includes(s.id))]));
  buildAdj(); labelCache = new Map();
  applyState({ found: STATIONS.map(s => s.id), hint: 0, gaveUp: false, score: 0, missing: [] }); hidden.clear();
  document.getElementById("modeName").textContent = m.sub;
  document.getElementById("legend").style.display = "";
  seedDrawn();
  menuEl.style.display = "none";
  fitFound(); render();
  say(`全${LINES.length}路線・${STATIONS.length}駅。路線のチェックで表示を切り替えられます（ホイールで拡大、ドラッグで移動）`);
}

// --- メニュー：①路線を選ぶ → ②プレイ方法（ノーマル／10駅チャレンジ／学習モード）を選ぶ → プレイ画面 ---
const menuList = document.getElementById("modeList"), menuLead = document.getElementById("menuLead"), menuBack = document.getElementById("menuBackBtn");
function showMenu() { // ①路線の選択
  menuLead.textContent = "駅名を入力して、東京23区の路線図を完成させよう。路線を選んでください。";
  menuBack.hidden = true; menuList.replaceChildren();
  for (const m of MODES) {
    if (m.viewOnly) { // 全部入り：スコアも進捗もなく、そのまま路線図を開く
      const c = document.createElement("button"), tot = m.stationObjs.length;
      c.className = "modeCard";
      c.innerHTML = `<div class="tag">路線図を眺める</div><h2>${m.name}</h2>
        <div class="stripes">${m.lineObjs.map(x => `<i style="background:${x.color}" title="${x.name}"></i>`).join("")}</div>
        <p>${m.desc}</p>
        <div class="prog"><span>${m.lineObjs.length}路線・${tot}駅</span></div>`;
      c.onclick = () => startView(m);
      menuList.appendChild(c);
      continue;
    }
    const tot = m.stationObjs.length, a = loadState(m, "normal"), b = loadState(m, "challenge", false), l = loadState(m, "learn"), c = document.createElement("button");
    c.className = "modeCard" + (a.found.length === tot ? " complete" : "");
    c.innerHTML = `<h2>${m.name}</h2>
      <div class="stripes">${m.lineObjs.map(x => `<i style="background:${x.color}" title="${x.name}"></i>`).join("")}</div>
      <p>${m.desc}</p>
      <div class="prog"><span>${m.lineObjs.length}路線・${tot}駅</span></div>
      <div class="sc"><span>ノーマル <b>${fmt(a.score)}点</b></span><span>10駅チャレンジ <b>${b ? fmt(b.score) + "点" : "未挑戦"}</b></span><span>学習 <b>${l.found.length}/${tot}駅</b></span></div>`;
    c.onclick = () => showTypes(m);
    menuList.appendChild(c);
  }
  menuEl.style.display = "flex"; menuEl.scrollTop = 0;
}
function showTypes(m) { // ②プレイ方法の選択
  menuLead.textContent = `${m.name} ― プレイ方法を選んでください。`;
  menuBack.hidden = false; menuList.replaceChildren();
  const tot = m.stationObjs.length, a = loadState(m, "normal"), b = loadState(m, "challenge", false), l = loadState(m, "learn");
  const left = b ? b.missing.filter(id => !b.found.includes(id)).length : CHALLENGE_N;
  const types = [
    { type: "normal", title: "ノーマル", tag: "白紙から全駅",
      desc: `路線図は白紙から。${tot}駅すべてを自分で入力して完成させます。ヒントを使わず完成すれば100点。`,
      prog: `${a.found.length} / ${tot}駅`, score: fmt(a.score) + "点", done: a.found.length === tot, bar: a.found.length / tot },
    { type: "challenge", title: "10駅チャレンジ", tag: "欠けた10駅だけ",
      desc: `路線図はほぼ完成済み。欠けている${Math.min(CHALLENGE_N, tot)}駅だけを入力します。スコアは0から始まり、ヒントを使わず完成すれば100点。始めるたびに欠ける駅が変わります。`,
      prog: b ? (left ? `残り${left}駅` : "クリア済み") : "未挑戦", score: fmt(b ? b.score : 0) + "点", done: b && !left, bar: b ? 1 - left / CHALLENGE_N : 0 },
    { type: "learn", title: "学習モード", tag: "ヒントつきで覚える",
      desc: "スコアなしで駅名を覚えるモード。最初から全駅の位置とひらがな1文字が地図に出ています。ヒントを使うと漢字や文字数も増え、減点はありません。",
      prog: `${l.found.length} / ${tot}駅`, score: "スコアなし", done: l.found.length === tot, bar: l.found.length / tot },
  ];
  for (const t of types) {
    const c = document.createElement("button");
    c.className = "modeCard" + (t.done ? " complete" : "");
    c.innerHTML = `<div class="tag">${t.tag}</div><h2>${t.title}</h2><p>${t.desc}</p>
      <div class="prog"><span>${t.done ? "🏆 " : ""}${t.prog}</span><span><b>${t.score}</b></span></div>
      <div class="bar"><i style="width:${t.bar * 100}%;background:var(--accent)"></i></div>`;
    c.onclick = () => startPlay(m, t.type);
    menuList.appendChild(c);
  }
  menuEl.scrollTop = 0;
}menuBack.onclick = showMenu;
document.getElementById("backBtn").onclick = showMenu;
showMenu();
</script>
</body>
